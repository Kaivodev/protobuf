syntax = "proto3";

package aipay.ledger.v1;

import "aipay/approval/v1/approval.proto";
import "aipay/authz/v1/policy.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/ledger/v1;ledgerv1";

// Server-derived state bound by a read-only exit approval. Clients cannot
// supply a replacement state. Times are UTC with microsecond precision.
message ReadOnlyExitSnapshot {
  string read_only_reason = 1;
  google.protobuf.Timestamp read_only_since = 2;
  // The requester's investigation note, 1 to 1000 characters.
  string note = 3;
  uint64 head_seq = 4;
  // 32 bytes; all zeros before the first journal transaction (head_seq = 0).
  bytes head_hash = 5;
  // 0 when no checkpoint exists.
  uint64 last_checkpoint_id = 6;
}

message RequestReadOnlyExitRequest {
  // Command request ID; same key/content returns the first result, changed
  // content is AlreadyExists. IAM metadata is not part of the command content.
  string idempotency_key = 1;
  // Investigation findings, 1 to 1000 characters.
  string note = 2;
}

message RequestReadOnlyExitResponse {
  // Kind read_only_exit, two distinct approvers, expires after 24 hours.
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  ReadOnlyExitSnapshot snapshot = 2;
}

message ApproveReadOnlyExitRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  // Raw browser assertion, as in AdjustmentService. Never log the assertion.
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveReadOnlyExitResponse {
  // EXECUTED means exit took effect; recording the first approval does not.
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  uint32 approvals = 2;
}

message RecordCarryoverRequest {
  string idempotency_key = 1;
  // Accounting period, currently YYYY-MM in UTC+8.
  string period_id = 2;
  // Registered suspense account code, not an IAM funds account UUID.
  string account_code = 3;
  // Nonzero, signed debit-positive period-end balance in the account's minor
  // units (10^-6 for USDT), not a USD reporting amount. May be negative.
  int64 units = 4;
  // 1 to 1000 characters.
  string reason = 5;
}

message RecordCarryoverResponse {
  // Kind carryover, one independent approver, expires after 24 hours.
  // Submission alone never satisfies a period-close precondition.
  aipay.approval.v1.ApprovalRequest approval_request = 1;
}

message ApproveCarryoverRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveCarryoverResponse {
  // EXECUTED means the note is effective, never that balances were changed.
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  uint32 approvals = 2;
}

message UsdRatePolicyVersion {
  uint64 version = 1;
  // Largest accepted deviation between the two USD rate sources, in ppm.
  uint32 threshold_ppm = 2;
  string approval_request_id = 3;
  google.protobuf.Timestamp approved_at = 4;
}

message RequestUsdRatePolicyRequest {
  string idempotency_key = 1;
  // 0 only when no version exists, otherwise the current version.
  uint64 expected_version = 2;
  // 1..AIPAY_LEDGER_USD_DEVIATION_PPM of the ledger deployment (the ceiling).
  uint32 threshold_ppm = 3;
  // Required, 1-1000 characters.
  string reason = 4;
}

message RequestUsdRatePolicyResponse {
  aipay.approval.v1.ApprovalRequest approval_request = 1;
}

message ApproveUsdRatePolicyRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveUsdRatePolicyResponse {
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  uint32 approvals = 2;
  // Present once the second approval created the version.
  UsdRatePolicyVersion version = 3;
}

message GetUsdRatePolicyRequest {}

message GetUsdRatePolicyResponse {
  // Absent when no version exists. The deployment ceiling then applies.
  UsdRatePolicyVersion current = 1;
  // AIPAY_LEDGER_USD_DEVIATION_PPM of this deployment.
  uint32 ceiling_ppm = 2;
  // min(current.threshold_ppm, ceiling_ppm), or ceiling_ppm when absent.
  uint32 effective_ppm = 3;
  // Pending usd_rate_policy request with its request_bytes, for approvers.
  aipay.approval.v1.ApprovalRequest pending = 4;
  google.protobuf.Timestamp as_of = 5;
}

enum LedgerServiceMode {
  LEDGER_SERVICE_MODE_UNSPECIFIED = 0;
  LEDGER_SERVICE_MODE_NORMAL = 1;
  LEDGER_SERVICE_MODE_READ_ONLY = 2;
}

message PendingReadOnlyExit {
  // Pending, unexpired request from the current read-only episode. Includes
  // request_bytes and request_digest for approvers.
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  ReadOnlyExitSnapshot snapshot = 2;
  // Approvals recorded so far, with assertions omitted.
  repeated aipay.approval.v1.Approval approvals = 3;
}

message GetReadOnlyStatusRequest {}

message GetReadOnlyStatusResponse {
  LedgerServiceMode mode = 1;
  // First recorded reason for the current read-only episode. Empty in normal mode.
  string read_only_reason = 2;
  // Time the ledger entered read-only mode or last exited to normal mode.
  google.protobuf.Timestamp mode_since = 3;
  // Service state version that binds an exit request to its read-only episode.
  uint64 state_version = 4;
  // ID of the executed approval request when in normal mode after an approved exit.
  string last_exit_request_id = 5;
  // Up to 20 pending exit requests from the current episode, newest first.
  // Always empty in normal mode.
  repeated PendingReadOnlyExit pending = 6;
  google.protobuf.Timestamp as_of = 7;
}

enum PeriodStatus {
  PERIOD_STATUS_UNSPECIFIED = 0;
  // Includes periods that have no stored row yet.
  PERIOD_STATUS_OPEN = 1;
  PERIOD_STATUS_CLOSING = 2;
  PERIOD_STATUS_CLOSED = 3;
}

message SuspenseBalance {
  string account_code = 1;
  // unmatched_receipts, upstream_diff or rounding.
  string account_type = 2;
  // Signed debit-positive minor units through period end, or to date while the
  // period is running. Uses the same calculation as the period-close suspense check.
  int64 units = 3;
  // ID of the executed carryover whose amount equals units. Empty if none matches.
  string carryover_approval_request_id = 4;
}

message PeriodCarryover {
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  string account_code = 2;
  // Signed debit-positive minor units recorded in the note.
  int64 units = 3;
  string reason = 4;
  // Approvals recorded so far, with assertions omitted.
  repeated aipay.approval.v1.Approval approvals = 5;
}

message GetPeriodCarryoversRequest {
  // Accounting period, YYYY-MM in UTC+8.
  string period_id = 1;
}

message GetPeriodCarryoversResponse {
  string period_id = 1;
  PeriodStatus status = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  // False while the period is running. Balances are then to date and may change.
  bool ended = 5;
  // Nonzero suspense balances only.
  repeated SuspenseBalance balances = 6;
  // Up to 200 carryover requests for the period across all statuses, newest first.
  repeated PeriodCarryover requests = 7;
  // True when the period has more than 200 requests.
  bool truncated = 8;
  google.protobuf.Timestamp as_of = 9;
}

// Administrative control, only through the backend management listener. All
// methods require a verified IAM assertion and platform acting scope; ledger
// itself checks that scope. Identity is taken from verified assertions, never
// client-supplied requester/approver fields. Approval additionally requires a
// valid WebAuthn signature from ledger's independent approver key registry,
// bound to the current verified user. The requester cannot approve.
//
// Every write persists its command request ID and content atomically with its
// result. Identical retries return the first result; changed content under the
// same key is AlreadyExists. Approval content includes the approval_request_id
// and the complete raw WebAuthn assertion, excluding renewable IAM metadata.
//
// Exit first cuts due checkpoints, retries anchoring and reruns trial balance
// and balance recomputation. Only a passed check permits an exit request. The
// final approval rechecks and exits atomically, bound to this read-only episode;
// an older episode's approval can never clear a later read-only state.
// Carryover approval only records the note; closing still requires exact
// equality of the noted amount and the account's actual period-end balance.
//
// GetReadOnlyStatus and GetPeriodCarryovers are read-only. Neither runs the
// exit self-check, cuts checkpoints or anchors them. GetReadOnlyStatus lists
// only requests from the current read-only episode in pending. GetPeriodCarryovers
// uses the same balance calculation as the period-close suspense check and sets
// carryover_approval_request_id exactly when that check would accept the balance.
//
// request_bytes (str/bytes have u32 big-endian lengths, integers big-endian,
// UUID bytes16 raw; signed times are Unix nanoseconds, microsecond precision):
//   read_only_exit:
//     str "aipay.ledger.read_only_exit.v1" || bytes16 approval_request_id ||
//     str requested_by || i64 requested_at || i64 expires_at ||
//     str read_only_reason || i64 read_only_since || str note ||
//     u64 head_seq || bytes head_hash || u64 last_checkpoint_id
//   carryover:
//     str "aipay.ledger.carryover.v1" || bytes16 approval_request_id ||
//     str requested_by || i64 requested_at || i64 expires_at ||
//     str period_id || str account_code || i64 units || str reason
//   usd_rate_policy:
//     str "aipay.ledger.usd_rate_policy.v1" || bytes16 approval_request_id ||
//     str requested_by || i64 requested_at || i64 expires_at ||
//     u64 version || u64 expected_version || u32 threshold_ppm ||
//     u32 ceiling_ppm || str reason
// For usd_rate_policy, version = expected_version + 1 and ceiling_ppm is the
// deployment ceiling at request time. Two distinct people other than the requester
// must approve. The second approval rechecks expected_version and verifies that
// threshold_ppm <= the current ceiling.
// As in approval/v1, challenge is SHA-256("AIPAY-APPROVAL-V1" || request_bytes).
service LedgerControlService {
  rpc RequestReadOnlyExit(RequestReadOnlyExitRequest) returns (RequestReadOnlyExitResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.read_only_exit.submit"
      }
    };
  }
  rpc ApproveReadOnlyExit(ApproveReadOnlyExitRequest) returns (ApproveReadOnlyExitResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.read_only_exit.approve"
      }
    };
  }
  rpc RecordCarryover(RecordCarryoverRequest) returns (RecordCarryoverResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.carryover.submit"
      }
    };
  }
  rpc ApproveCarryover(ApproveCarryoverRequest) returns (ApproveCarryoverResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.carryover.approve"
      }
    };
  }
  rpc RequestUsdRatePolicy(RequestUsdRatePolicyRequest) returns (RequestUsdRatePolicyResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.rate_policy.submit"
      }
    };
  }
  rpc ApproveUsdRatePolicy(ApproveUsdRatePolicyRequest) returns (ApproveUsdRatePolicyResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.rate_policy.approve"
      }
    };
  }
  rpc GetUsdRatePolicy(GetUsdRatePolicyRequest) returns (GetUsdRatePolicyResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.rate_policy.read"
      }
    };
  }
  rpc GetReadOnlyStatus(GetReadOnlyStatusRequest) returns (GetReadOnlyStatusResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.read_only_exit.read"
      }
    };
  }
  rpc GetPeriodCarryovers(GetPeriodCarryoversRequest) returns (GetPeriodCarryoversResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "ledger.carryover.read"
      }
    };
  }
}
