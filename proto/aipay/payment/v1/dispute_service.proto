syntax = "proto3";

package aipay.payment.v1;

import "aipay/approval/v1/approval.proto";
import "aipay/authz/v1/policy.proto";
import "aipay/common/v1/trade.proto";
import "aipay/payment/v1/admin_approval.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/payment/v1;paymentv1";

// Fact recorded only after ledger confirms the matching dispute barrier.
// Amounts/owners are original; no claim to funds already released. Evidence is
// immutable; SHA-256(canonical DisputeEvidence) is recomputed independently.
message RegisteredDispute {
  string dispute_id = 1;
  aipay.common.v1.TradeSnapshot trade = 2;
  string escrow_reservation_id = 3;
  uint64 control_version = 4;
  string reason = 5;
  bytes evidence_sha256 = 6;
  string registered_by = 7;
  google.protobuf.Timestamp registered_at = 8;
}

message RegisterDisputeRequest {
  string idempotency_key = 1;
  string order_id = 2;
  string escrow_reservation_id = 3;
  uint64 expected_control_version = 4;
  string reason = 5;
  DisputeEvidence evidence = 6;
}

message RegisterDisputeResponse {
  RegisteredDispute dispute = 1;
}

message SubmitDisputeRulingRequest {
  string idempotency_key = 1;
  string dispute_id = 2;
  uint64 expected_control_version = 3;
  DisputeRulingOutcome outcome = 4;
  string reason = 5;
}

message SubmitDisputeRulingResponse {
  PaymentApproval approval = 1;
}

message ApproveDisputeRulingRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveDisputeRulingResponse {
  PaymentApproval approval = 1;
}

message GetDisputeRulingRequest {
  // payment's immutable approval request ID, never merely an order ID.
  string ruling_id = 1;
}

message GetDisputeRulingResponse {
  // Exact original request bytes, typed material, digest, status and every
  // original WebAuthn approval; no public keys or trusted identity mapping.
  PaymentApproval approval = 1;
  DisputeEvidence evidence = 2;
}

// Management commands require backend's independent management listener, USER
// proof and platform scope. payment checks original resource/target constraints.
// Idempotency is per method/verified initiating user/key: changed content is
// AlreadyExists; identical authorized retries return the original result before
// fresh CAS/expiry checks. All IDs/messages/positive versions/digests/times are
// required; unknown enum values and UNSPECIFIED (0) are rejected.
//
// Register persists intent/evidence and a stable dispute ID before calling
// HoldTradeForDispute with key payment.disputes:<dispute_id>. Only a confirmed
// ledger barrier permits a success response and atomic local OrderDisputed v1
// outbox registration. Unknown/recovery retries query/reuse the same hold; no
// second dispute/hold. Registration itself is protective, not a funds ruling.
//
// Submit loads original snapshots/evidence and current actual barrier, creates
// kind dispute_ruling with required_approvals=2, expires after 24h. Only one
// pending/approved actionable ruling per dispute. Approve independently checks
// WebAuthn against payment's registry, requires two distinct natural persons
// neither the initiator, and rechecks current barrier/version before completion.
// Neither method clears ledger barriers or creates a funds authorization.
//
// Get is reconciliation-only mTLS, without user assertion. Return the original
// state even when pending/expired; NotFound for an unknown/non-ruling ID.
// reconciliation recomputes canonical bytes/evidence and independently checks
// signatures, registry identities, expiry/revocation, counters/replays, actual
// ledger escrow/control/barrier and external payment/refund evidence. First
// authorization must still be within the request's validity by its own clock.
// It uses
// its OWN approver public-key/person/IAM mapping, never payment-supplied keys.
// Missing evidence, errors or stale versions forbid authorization. The original
// request_digest is exactly DisputeResolution.ruling_sha256; id is ruling_id;
// approved_at is the second valid approval's verified_at. Never trust a success
// flag or digest without verifying the original material and both assertions.
//
// Outcomes map only to existing release/cancellation/refund authorizations;
// all original checks remain. No new accounts or amounts. REFUND is fail-closed
// if no matching confirmed refund occupation or safe ledger handoff exists:
// current ledger forbids reserving against an unresolved dispute. This contract
// does not invent that handoff or a hold over already released funds.
service DisputeService {
  rpc RegisterDispute(RegisterDisputeRequest) returns (RegisterDisputeResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.dispute.register"
      }
    };
  }
  rpc SubmitDisputeRuling(SubmitDisputeRulingRequest) returns (SubmitDisputeRulingResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.dispute.submit"
      }
    };
  }
  rpc ApproveDisputeRuling(ApproveDisputeRulingRequest) returns (ApproveDisputeRulingResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.dispute.approve"
      }
    };
  }
  rpc GetDisputeRuling(GetDisputeRulingRequest) returns (GetDisputeRulingResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "reconciliation"
        assertion: ASSERTION_REQUIREMENT_NOT_REQUIRED
      }
    };
  }
}
