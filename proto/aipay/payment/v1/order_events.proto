syntax = "proto3";

package aipay.payment.v1;

import "aipay/common/v1/trade.proto";
import "aipay/ledger/v1/trade.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/payment/v1;paymentv1";

// Payloads on payment.orders, producer payment, receivers ledger and
// reconciliation. event_type equals the message name. OrderPaid,
// RefundSucceeded, RefundFailed and OrderReversed use schema_version=2.
// Version 1 of those four types remains historical. Their v2 payloads require
// original snapshots/IDs, positive control versions, UTC microsecond times and
// 32-byte evidence digests. Refund branch UNSPECIFIED (0)/unknown is rejected.
// Each fact and outbox row commit together. Signatures/digests alone do not
// establish external truth or authorize a ledger funds movement.

// OrderPaid v2 confirms ONLY actively queried fiat payment (A111), never
// upstream USDT receivables, recipient balance availability or release.
message OrderPaid {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  uint64 control_version = 3;
  string upstream_order_id = 4;
  google.protobuf.Timestamp paid_verified_at = 5;
  // Original base deadline = paid_verified_at + locked hold_duration_seconds.
  google.protobuf.Timestamp risk_release_at = 6;
  // Query evidence binds original channel/platform/upstream IDs, original fiat
  // currency/amount and paid terminal result; no raw credentials in the event.
  bytes query_evidence_sha256 = 7;
}

// RefundSucceeded v2: verified original-route FULL fiat refund only. The
// signed fact starts reconciliation's independent verification for either
// reservation branch. Both terminal types share (refund_id, control_version)
// as the review key. Only reconciliation authorization permits ledger posting.
// Post-release, A112 reverses N and all three F components, restoring seller Q.
// Under A139, upstream_refund_id is the approved upstream_refund_no,
// verified_at is the emission time at or after objection_deadline, and
// query_evidence_sha256 is the approved seller_refund request_digest.
message RefundSucceeded {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  uint64 control_version = 3;
  string refund_id = 4;
  string out_refund_no = 5;
  string refund_reservation_id = 6;
  aipay.ledger.v1.RefundReservationBranch branch = 7;
  string upstream_refund_id = 8;
  google.protobuf.Timestamp verified_at = 9;
  bytes query_evidence_sha256 = 10;
}

// RefundFailed v2 requires a definitive verified failure. Pending or
// unknown refunds emit no terminal fact and keep funds occupied. As with
// RefundSucceeded, this starts independent verification for either branch.
// A conflicting terminal fact for the same review key is quarantined. Only
// independent authorization restores this refund's source, preserving other barriers.
// Under A139, emit at the second seller_refund_failure approval. verified_at
// is that approval time, with no objection window. upstream_refund_id is the
// number from the evidence bound to that approval, or the literal "none" if
// absent. query_evidence_sha256 is its approved request_digest and
// failure_reason is the fixed code "seller_refund_failed".
message RefundFailed {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  uint64 control_version = 3;
  string refund_id = 4;
  string out_refund_no = 5;
  string refund_reservation_id = 6;
  aipay.ledger.v1.RefundReservationBranch branch = 7;
  string upstream_refund_id = 8;
  google.protobuf.Timestamp verified_at = 9;
  bytes query_evidence_sha256 = 10;
  string failure_reason = 11;
}

// OrderReversed v2 binds the approved original-order correction and evidence.
// No arbitrary amount/account override. A chargeback callback never directly
// takes released funds; this fact cannot substitute for independent funds
// authorization, escrow barriers or approved posting rules.
message OrderReversed {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  uint64 control_version = 3;
  string original_event_id = 4;
  string approval_request_id = 5;
  // Required, 1 to 1000 characters.
  string reason = 6;
  bytes evidence_sha256 = 7;
  google.protobuf.Timestamp reversed_at = 8;
}

// payment.orders, event_type=OrderDisputed, schema_version=1 (new type; the
// four existing event types above remain v2). Producer payment; receivers
// ledger/reconciliation. Original snapshots/IDs and a positive post-hold
// control_version are required. Record only after ledger confirms the matching
// dispute barrier; payment registration and outbox commit in one transaction.
// This reports the existing hold, never creates a second hold, clears a barrier
// or authorizes funds movement. Registered actor comes from verified authority;
// UTC microsecond timestamp and 32-byte evidence digest are required. No raw
// party evidence, assertions or keys. Ruling approval is NOT funds settlement.
message OrderDisputed {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  uint64 control_version = 3;
  string dispute_id = 4;
  string reason = 5;
  bytes evidence_sha256 = 6;
  string registered_by = 7;
  google.protobuf.Timestamp registered_at = 8;
}

// Signed payment.orders event_type=OrderCancellationVerificationRequested,
// schema_version=1. After accepting a close, payment commits the upstream
// dispatch confirmation and outbox together while no payment is known.
// After an uncertain send, an active query confirming closure of the same
// order can recover that trigger. Local acceptance or expiry alone cannot.
// Reconciliation starts one review per (order_id, control_version), reads the
// original snapshot from ledger and independently queries the original order.
// Only two closed/unpaid observations separated by the late-payment window
// can support cancellation. Ledger records this trigger without a funds action.
message OrderCancellationVerificationRequested {
  // Required UUIDv7 of the original order.
  string order_id = 1;
  // Required UUIDv7 of that order's ledger escrow.
  string escrow_reservation_id = 2;
  // Positive ledger escrow control version at the trigger.
  uint64 control_version = 3;
}

// Signed payment.orders event_type=DisputeRulingApproved, schema_version=1.
// When the second valid approval makes the ruling APPROVED, payment commits
// the state change and outbox row together, at most once per ruling_id.
// Expired or rejected rulings emit no event. Approval alone proves neither
// payment nor refund and does not settle funds.
// Reconciliation starts one review per (dispute_id, ruling_id). It reads the
// outcome and original evidence via GetDisputeRuling, independently verifies
// both approvers and their signatures, and checks the current ledger escrow.
// Ledger records this trigger without a funds action.
message DisputeRulingApproved {
  // Required UUIDv7 of the original order.
  string order_id = 1;
  // Required UUIDv7 of that order's ledger escrow.
  string escrow_reservation_id = 2;
  // Required positive expected_control_version bound at ruling submission.
  uint64 control_version = 3;
  // Required ID of the registered dispute.
  string dispute_id = 4;
  // Required ruling approval request ID used by GetDisputeRuling.
  string ruling_id = 5;
}
