syntax = "proto3";

package aipay.payment.v1;

import "aipay/approval/v1/approval.proto";
import "aipay/authz/v1/policy.proto";
import "aipay/common/v1/money.proto";
import "aipay/common/v1/query.proto";
import "aipay/common/v1/trade.proto";
import "aipay/payment/v1/admin_approval.proto";
import "aipay/payment/v1/refund_service.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/payment/v1;paymentv1";

enum SellerRefundEvidenceStatus {
  SELLER_REFUND_EVIDENCE_STATUS_UNSPECIFIED = 0;
  SELLER_REFUND_EVIDENCE_STATUS_SUBMITTED = 1;
  SELLER_REFUND_EVIDENCE_STATUS_APPROVED = 2;
  SELLER_REFUND_EVIDENCE_STATUS_REJECTED = 3;
  SELLER_REFUND_EVIDENCE_STATUS_OBJECTED = 4;
  SELLER_REFUND_EVIDENCE_STATUS_WITHDRAWN = 5;
}

message SellerRefundEvidenceFileDigest {
  // SHA-256 of the exact stored JPEG bytes.
  bytes sha256 = 1;
  // Always image/jpeg.
  string content_type = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 size_bytes = 5;
}

// Immutable input to evidence_sha256. Hash the length-prefixed domain
// str("aipay.payment.seller_refund_evidence.v1") followed by this material
// in canonical approval field order. Include note presence, the file count
// and every file's digest, content type, dimensions and size in submission order.
message SellerRefundEvidenceMaterial {
  SellerRefundSubject subject = 1;
  string evidence_id = 2;
  uint64 version = 3;
  // Seller user from the verified account assertion.
  string submitted_by = 4;
  google.protobuf.Timestamp submitted_at = 5;
  // 1-64 characters from [A-Za-z0-9._:-].
  string upstream_refund_no = 6;
  // After paid_verified_at for refunds or order creation for late payments.
  // At most five minutes ahead of payment's current time.
  google.protobuf.Timestamp refunded_at = 7;
  // FULL_REFUND_ONLY: currency and minor units must match the original fiat quote.
  aipay.common.v1.Money refunded_amount = 8;
  // Optional, 0-200 characters. Exclude from logs, notices and audit text.
  optional string note = 9;
  // 1-3 JPEG files, each at most 1 MiB and at most 3 MiB combined.
  repeated SellerRefundEvidenceFileDigest files = 10 [(aipay.common.v1.max_items) = 3];
}

message SellerRefundEvidence {
  SellerRefundEvidenceMaterial material = 1;
  bytes evidence_sha256 = 2;
  SellerRefundEvidenceStatus status = 3;
  // File IDs correspond one-to-one to material.files in submission order.
  repeated string file_ids = 4 [(aipay.common.v1.max_items) = 3];
  // Rejection or objection reason (1-1000 characters), for seller/platform views only.
  string status_reason = 5;
  google.protobuf.Timestamp status_changed_at = 6;
}

message SellerRefundEvidenceUpload {
  // Always image/jpeg. Backend deterministically re-encodes and strips metadata.
  string content_type = 1;
  // JPEG bytes, at most 1 MiB. Payment checks the start and end markers.
  bytes data = 2;
}

enum LatePaymentStatus {
  LATE_PAYMENT_STATUS_UNSPECIFIED = 0;
  LATE_PAYMENT_STATUS_AWAITING_SELLER = 1;
  LATE_PAYMENT_STATUS_AWAITING_REVIEW = 2;
  LATE_PAYMENT_STATUS_CLOSED = 3;
  LATE_PAYMENT_STATUS_CLOSED_UNREFUNDED = 4;
}

// An active query confirmed full payment on an order that ledger cancelled.
// Seller evidence and dual review close the case entirely in payment.
message LatePayment {
  string late_payment_id = 1;
  aipay.common.v1.TradeSnapshot trade = 2;
  string escrow_reservation_id = 3;
  string upstream_order_id = 4;
  aipay.common.v1.Money fiat_amount = 5;
  bytes query_evidence_sha256 = 6;
  google.protobuf.Timestamp detected_at = 7;
  LatePaymentStatus status = 8;
  google.protobuf.Timestamp seller_due_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // A145: present when the order was cancelled after a platform forced
  // close; the ID of that approved forced_close request.
  optional string forced_close_approval_request_id = 12;
  // A147: present when ledger cancelled the order under a dispute return ruling
  // after payment observed the buyer's payment during that dispute.
  optional string dispute_id = 13;
}

enum SellerRefundDuplicateKind {
  SELLER_REFUND_DUPLICATE_KIND_UNSPECIFIED = 0;
  SELLER_REFUND_DUPLICATE_KIND_SCREENSHOT = 1;
  SELLER_REFUND_DUPLICATE_KIND_UPSTREAM_REFUND_NO = 2;
}

message SellerRefundDuplicate {
  SellerRefundDuplicateKind kind = 1;
  SellerRefundSubject other = 2;
}

// Platform review view. Evidence contains metadata for all versions, newest last.
message SellerRefundReview {
  oneof subject_view {
    Refund refund = 1;
    LatePayment late_payment = 2;
  }
  repeated SellerRefundEvidence evidence = 3;
  // Present when there is a current seller_refund request.
  PaymentApproval approval = 4;
  // Present when there is a failure request.
  PaymentApproval failure_approval = 5;
  repeated SellerRefundDuplicate duplicates = 6;
}

message GetSellerRefundReviewRequest {
  SellerRefundSubject subject = 1;
}

// Platform review. Each approval assertion contains only credential_id.
message GetSellerRefundReviewResponse {
  SellerRefundReview review = 1;
}

message GetSellerRefundEvidenceFileRequest {
  string file_id = 1;
}

message GetSellerRefundEvidenceFileResponse {
  SellerRefundEvidenceFileDigest file = 1;
  bytes data = 2;
}

message ApproveSellerRefundRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveSellerRefundResponse {
  PaymentApproval approval = 1;
}

message RejectSellerRefundEvidenceRequest {
  string idempotency_key = 1;
  string evidence_id = 2;
  uint64 expected_evidence_version = 3;
  // Required, 1-1000 characters.
  string reason = 4;
}

message RejectSellerRefundEvidenceResponse {}

message RecordRefundObjectionRequest {
  string idempotency_key = 1;
  string refund_id = 2;
  string approval_request_id = 3;
  // Required, 1-1000 characters.
  string reason = 4;
}

message RecordRefundObjectionResponse {}

message SubmitSellerRefundFailureRequest {
  string idempotency_key = 1;
  SellerRefundSubject subject = 2;
  // Required, 1-1000 characters.
  string reason = 3;
}

message SubmitSellerRefundFailureResponse {
  PaymentApproval approval = 1;
}

message ApproveSellerRefundFailureRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveSellerRefundFailureResponse {
  PaymentApproval approval = 1;
}

message GetSellerRefundReviewForVerificationRequest {
  string refund_id = 1;
}

message GetSellerRefundReviewForVerificationResponse {
  // Reconciliation alone receives the approval that produced the terminal fact,
  // including original request bytes, digest, typed material and both complete assertions.
  PaymentApproval approval = 1;
  // Present unless a failure was approved without seller evidence. Only metadata
  // is returned. Omit status_reason from this verification response.
  SellerRefundEvidence evidence = 2;
}

// Management calls require backend's management listener, a platform USER
// assertion and verified target scope. Audit each image read with actor and file ID.
// Bind each write to method, verified user and idempotency key. After checking
// access, replay the original result for identical content before fresh version
// or expiry checks. Changed content under the same key returns AlreadyExists.
//
// Each approval checks the operation kind and the original WebAuthn assertion
// against payment's registry. Require two distinct platform natural persons,
// neither the seller nor the request initiator. A new evidence version voids
// prior approvals. Requests expire after 24 hours. Renewal requires two new
// signatures. At the second approval, recheck state, evidence version, refund
// number uniqueness and ledger occupation/version for refunds. Rejection or
// a timely objection voids the request and resets the seller deadline. Failure may
// start only in AWAITING_SELLER or AWAITING_REVIEW. Its second approval
// withdraws outstanding evidence and emits RefundFailed for a refund.
//
// Reconciliation alone retrieves the terminal approval by refund ID over mTLS,
// without user proof or side effects. Unknown or non-manual refunds return
// NotFound. Before authorizing, reconstruct the canonical evidence and request
// bytes and digests. Require APPROVED or EXECUTED and exactly two valid
// approvals. Match the approval kind, subject, trade, reservation,
// branch, version and full amount to the signed fact and ledger. Verify both
// ES256 assertions with reconciliation's OWN credential, IAM and natural-person
// registry, including challenge, RP ID, origin, UP/UV, identity separation,
// expiry, revocation and counter rollback. Each assertion must have been
// verified within the request lifetime. Require approved_at to equal the second
// assertion's verified_at. On success, enforce the signed objection window
// and its local minimum. Check all other ledger barriers. Payment's status,
// identity mapping and digest cannot establish any of these checks. Late
// payments close inside payment after dual review.
service SellerRefundReviewService {
  rpc GetSellerRefundReview(GetSellerRefundReviewRequest) returns (GetSellerRefundReviewResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.review.read"
      }
    };
  }
  rpc GetSellerRefundEvidenceFile(GetSellerRefundEvidenceFileRequest) returns (GetSellerRefundEvidenceFileResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.review.read"
      }
    };
  }
  rpc ApproveSellerRefund(ApproveSellerRefundRequest) returns (ApproveSellerRefundResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.review"
      }
    };
  }
  rpc RejectSellerRefundEvidence(RejectSellerRefundEvidenceRequest) returns (RejectSellerRefundEvidenceResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.review"
      }
    };
  }
  rpc RecordRefundObjection(RecordRefundObjectionRequest) returns (RecordRefundObjectionResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.review"
      }
    };
  }
  rpc SubmitSellerRefundFailure(SubmitSellerRefundFailureRequest) returns (SubmitSellerRefundFailureResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.fail.submit"
      }
    };
  }
  rpc ApproveSellerRefundFailure(ApproveSellerRefundFailureRequest) returns (ApproveSellerRefundFailureResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.refund.review"
      }
    };
  }
  rpc GetSellerRefundReviewForVerification(GetSellerRefundReviewForVerificationRequest) returns (GetSellerRefundReviewForVerificationResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "reconciliation"
        assertion: ASSERTION_REQUIREMENT_NOT_REQUIRED
      }
    };
  }
}
