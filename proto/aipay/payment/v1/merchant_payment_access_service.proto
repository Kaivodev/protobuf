syntax = "proto3";

package aipay.payment.v1;

import "aipay/authz/v1/policy.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/payment/v1;paymentv1";

// Review status is separate from enabled. Receivers reject UNSPECIFIED (0)
// and unknown values. Missing record means not submitted. Only current valid
// APPROVED revisions may be enabled; approval never enables automatically.
enum PaymentAccessReviewStatus {
  PAYMENT_ACCESS_REVIEW_STATUS_UNSPECIFIED = 0;
  PAYMENT_ACCESS_REVIEW_STATUS_DRAFT = 1;
  PAYMENT_ACCESS_REVIEW_STATUS_PENDING = 2;
  PAYMENT_ACCESS_REVIEW_STATUS_APPROVED = 3;
  PAYMENT_ACCESS_REVIEW_STATUS_REJECTED = 4;
  PAYMENT_ACCESS_REVIEW_STATUS_SUSPENDED = 5;
  PAYMENT_ACCESS_REVIEW_STATUS_REVOKED = 6;
}

// Receivers reject UNSPECIFIED (0)/unknown. Only the platform reviewer decides.
enum PaymentAccessReviewDecision {
  PAYMENT_ACCESS_REVIEW_DECISION_UNSPECIFIED = 0;
  PAYMENT_ACCESS_REVIEW_DECISION_APPROVE = 1;
  PAYMENT_ACCESS_REVIEW_DECISION_REJECT = 2;
}

message PaymentAccessMaterials {
  string business_name = 1;
  string business_description = 2;
  // Nonempty normalized exact domains, no duplicates or implicit subdomains,
  // wildcards or suffix matching. Not an authorization or origin proof.
  repeated string domains = 3;
  // Nonempty, distinct explicit applications of this business/ownership.
  repeated string application_ids = 4;
}

// Immutable submitted material. All fields required, positive versions and a
// 32-byte digest binding materials AND account/business/method/ownership.
message PaymentAccessRevision {
  string payment_access_id = 1;
  uint64 version = 2;
  uint64 ownership_version = 3;
  PaymentAccessMaterials materials = 4;
  bytes materials_sha256 = 5;
  // Generated by payment from verified user proof and its authoritative clock.
  string submitted_by = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

message PaymentAccessReview {
  string payment_access_id = 1;
  uint64 revision_version = 2;
  bytes materials_sha256 = 3;
  PaymentAccessReviewDecision decision = 4;
  // Required, 1 to 1000 characters; evidence digest is exactly 32 bytes.
  string reason = 5;
  bytes evidence_sha256 = 6;
  // From the platform user proof; never equal to the revision submitter.
  string reviewed_by = 7;
  google.protobuf.Timestamp reviewed_at = 8;
}

message MerchantPaymentAccess {
  string payment_access_id = 1;
  // Unique tuple; IDs alone are not authorization evidence.
  string account_id = 2;
  string business_id = 3;
  string payment_method = 4;
  uint64 ownership_version = 5;
  PaymentAccessRevision current_revision = 6;
  PaymentAccessReviewStatus review_status = 7;
  bool enabled = 8;
  uint64 control_version = 9;
  // Absent until reviewed; may refer to an older immutable revision.
  PaymentAccessReview latest_review = 10;
}

message ListRequest {
  string account_id = 1;
  string business_id = 2;
  string payment_method = 3;
  // 1 to 500; opaque cursor binds filters and verified access scope.
  uint32 limit = 4;
  string page_token = 5;
}

message ListResponse {
  repeated MerchantPaymentAccess accesses = 1;
  string next_page_token = 2;
}

message GetRequest {
  string payment_access_id = 1;
}

message GetResponse {
  MerchantPaymentAccess access = 1;
}

message SubmitRequest {
  string idempotency_key = 1;
  string account_id = 2;
  string business_id = 3;
  string payment_method = 4;
  uint64 ownership_version = 5;
  PaymentAccessMaterials materials = 6;
  // 0 ONLY when the tuple has no record; otherwise positive current version.
  uint64 expected_control_version = 7;
}

message SubmitResponse {
  MerchantPaymentAccess access = 1;
}

message ReviewRequest {
  string idempotency_key = 1;
  string payment_access_id = 2;
  uint64 expected_control_version = 3;
  uint64 expected_revision_version = 4;
  bytes materials_sha256 = 5;
  PaymentAccessReviewDecision decision = 6;
  string reason = 7;
  bytes evidence_sha256 = 8;
}

message ReviewResponse {
  MerchantPaymentAccess access = 1;
}

message SetEnabledRequest {
  string idempotency_key = 1;
  string payment_access_id = 2;
  uint64 expected_control_version = 3;
  // Presence required: explicitly true/false, never an implicit default.
  optional bool enabled = 4;
}

message SetEnabledResponse {
  MerchantPaymentAccess access = 1;
}

message SuspendRequest {
  string idempotency_key = 1;
  string payment_access_id = 2;
  uint64 expected_control_version = 3;
  // Required, 1 to 1000 characters.
  string reason = 4;
}

message SuspendResponse {
  MerchantPaymentAccess access = 1;
}

message RevokeRequest {
  string idempotency_key = 1;
  string payment_access_id = 2;
  uint64 expected_control_version = 3;
  // Required, 1 to 1000 characters.
  string reason = 4;
}

message RevokeResponse {
  MerchantPaymentAccess access = 1;
}

// backend carries a USER proof; ordinary API application credentials cannot
// manage or read eligibility. List/Get/Submit/SetEnabled require account or
// business scope. Review/Suspend/Revoke require platform scope AND backend's
// management listener; method options cannot encode these extra constraints.
// Reviewers cannot review their own submission. All writes serialize with order
// creation and dispatch grants, increment control_version and retain audit.
// Same key/different content is AlreadyExists; identical authorized retries
// return the original result before a fresh CAS check. Stale versions fail.
// Submit creates a new immutable revision, PENDING with enabled=false; review
// rechecks ownership/materials. SUSPENDED requires platform reconfirmation of
// the valid current revision before merchant enablement; Submit cannot bypass
// suspension. REVOKED requires a new submission, never replay of old approval.
// Changes stop new dispatch grants, not already in-flight requests, and never
// rewrite old orders or stop their query/refund/notification/reconciliation.
service MerchantPaymentAccessService {
  rpc List(ListRequest) returns (ListResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.read"
      }
    };
  }
  rpc Get(GetRequest) returns (GetResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.read"
      }
    };
  }
  rpc Submit(SubmitRequest) returns (SubmitResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.manage"
      }
    };
  }
  rpc Review(ReviewRequest) returns (ReviewResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.review"
      }
    };
  }
  rpc SetEnabled(SetEnabledRequest) returns (SetEnabledResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.manage"
      }
    };
  }
  rpc Suspend(SuspendRequest) returns (SuspendResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.suspend"
      }
    };
  }
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "payment.access.suspend"
      }
    };
  }
}
