syntax = "proto3";

package aipay.payment.v1;

import "aipay/approval/v1/approval.proto";
import "aipay/common/v1/money.proto";
import "aipay/common/v1/trade.proto";
import "aipay/ledger/v1/trade.proto";
import "aipay/payment/v1/order_service.proto";
import "aipay/payment/v1/pricing_events.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/payment/v1;paymentv1";

// All IDs/messages/versions/digests/times are required unless stated otherwise.
// IDs are UUIDv7; SHA-256 digests are 32 bytes; times are UTC microseconds.
// Receivers reject unknown fields/enums and UNSPECIFIED (0), absent required
// presence, stale versions and unverifiable authority. No secrets/assertions
// or raw evidence may enter logs. See docs contracts.md for canonical encoding.

// Full replacement of routing configuration, never a patch to old orders.
// Credential material is identified by an immutable reference and digest;
// this message never carries secret bytes.
// New accounts start disabled. Enabling requires an independently approved
// plugin binding, approved seller binding, pricing and explicit risk policy.
message ChannelAccountConfiguration {
  string channel_account_id = 1;
  string channel_code = 2;
  string name = 3;
  string seller_account_id = 4;
  // Binds the authoritative reviewed seller record; a caller's digest/ID alone
  // is not proof. Recheck current review at submission AND execution.
  bytes seller_review_sha256 = 5;
  repeated string payment_methods = 6;
  string fiat_currency = 7;
  // Positive fiat minor units, max >= min; daily limit >= max.
  int64 min_amount_fiat = 8;
  int64 max_amount_fiat = 9;
  int64 daily_limit_fiat = 10;
  int32 priority = 11;
  uint32 weight = 12;
  // Nonempty immutable reference generated by the trade gateway in gateway
  // mode, or internal to payment in embedded mode.
  string credentials_ref = 13;
  // Exact normalized nonsecret JSON bytes, validated against plugin manifest.
  bytes config_json = 14;
  // Required presence. Changes affect new dispatch grants only.
  optional bool enabled = 15;
  // Approved inbound callback source networks. Canonical unique CIDRs; empty
  // denies all. Nonempty lists are sorted and bound into the two-person
  // approval digest. Empty adds no canonical bytes to legacy materials.
  repeated string callback_source_cidrs = 16;
  // Required on new gateway submissions. Must match the digest payment
  // registered for this ref, channel_account_id and channel_code. At enable
  // and dispatch, registered names and types must exactly match the manifest's
  // secrets and public_keys. Embedded mode rejects this field.
  // Canonical encoding appends u8(1) || B(value) after field 16 when present.
  // Absence adds no bytes.
  optional bytes credentials_sha256 = 17;
  // v0.23.0 (A130): lifetime of the buyer payment instruction for new
  // dispatches on this channel, in whole seconds, 1..floor(the payment
  // deployment's AIPAY_PLUGIN_INSTRUCTION_TTL). Absence uses that deployment
  // value. Payment rejects a larger value at submission and second approval.
  // At dispatch, payment clamps the lifetime to the deployment ceiling and
  // caps any plugin- or gateway-provided instruction expiry to that lifetime.
  // Canonical approval and web-command encodings append u8(1) || u32(value)
  // after field 17 when present. Absence adds no bytes.
  optional uint32 payment_instruction_ttl_seconds = 18;
}

message ChannelAccountChange {
  ChannelAccountConfiguration configuration = 1;
  // 0 only for a new ID, otherwise positive current routing control version.
  uint64 expected_control_version = 2;
}

// Platform availability, separate from merchant eligibility. Current codes:
// alipay, wxpay, bank; adding a row cannot open an undesigned EPay route.
message PaymentMethodChange {
  string payment_method = 1;
  string name = 2;
  optional bool enabled = 3;
  // 0 only if absent; otherwise positive current method control version.
  uint64 expected_control_version = 4;
}

message RiskPolicyChange {
  string risk_policy_version = 1;
  string channel_account_id = 2;
  // All require presence. Hold can be an explicitly approved 0; others > 0.
  optional uint64 hold_duration_seconds = 3;
  optional uint64 exceptional_extension_seconds = 4;
  optional uint64 dispute_handling_timeout_seconds = 5;
  // Not before approval completion; affects new orders only. A dispute timeout
  // never releases funds and policy replacement cannot shorten old deadlines.
  google.protobuf.Timestamp effective_at = 6;
  uint64 expected_control_version = 7;
}

message PricingDraft {
  string draft_id = 1;
  uint64 revision = 2;
  PricingConfiguration configuration = 3;
  google.protobuf.Timestamp effective_at = 4;
}

// Exact frozen draft submitted for approval; A110 scope, ppm and rounding
// semantics are those of PricingConfiguration/TradeQuoteSnapshot.
message PricingVersionChange {
  PricingDraft draft = 1;
  // Current version of the target+side configuration; 0 only if absent.
  uint64 expected_control_version = 2;
}

message PluginFixture {
  // Unique normalized relative path under fixtures/, no traversal or links.
  string path = 1;
  bytes content = 2;
}

// Immutable CI-built payment package only. Since v0.8.0 the approval material
// binds the package by digest: plugin_wasm and fixtures are left empty here and
// payment stores the uploaded package bytes itself, so approval responses stay
// small (approvers rebuild the package from source to check package_sha256).
// The manifest declares payment, code, semver, host ABI, domain allowlist,
// secret reference names, config schema,
// capabilities, callback rules and build provenance. Gateway mode requires a
// canonical ABI v3 manifest with Rust build fields and a component up to 4 MiB.
// The trade gateway verifies the package with ReplayPackage. Embedded mode
// uses ABI v2 Go wasip1 reactors up to 12 MiB. Reject statement plugins, unknown
// fields, duplicate code/semver with different content and unsupported host ABIs.
message PluginVersionMaterial {
  string plugin_version_id = 1;
  bytes manifest_json = 2;
  // Superseded by plugin_wasm (decision A120); always empty.
  bytes plugin_js = 3 [deprecated = true];
  // Upload fixtures are sorted by path and replayed before approval.
  // Credentials never enter recordings.
  repeated PluginFixture fixtures = 4;
  // SHA-256(normalized manifest_json || plugin_wasm), matching the CI artifact.
  bytes package_sha256 = 5;
  // Digest of the successful replay report from the trade gateway or embedded host.
  bytes regression_report_sha256 = 6;
  // Empty in approval material since v0.8.0. Bytes travel only in UploadPluginRequest.
  bytes plugin_wasm = 7;
  // SHA-256 over the canonical encoding of the sorted fixtures (contracts.md).
  // Required in approval material since v0.8.0; fixtures themselves are empty.
  bytes fixtures_sha256 = 8;
}

// Separate approval from publishing the package. Rollback is another enable
// request for a previously approved immutable version, with two new approvals.
message PluginEnableChange {
  string channel_account_id = 1;
  uint64 expected_control_version = 2;
  string plugin_version_id = 3;
  bytes package_sha256 = 4;
  string publication_approval_request_id = 5;
  bytes publication_request_digest = 6;
  // v0.9.0: approved plugin-wide fence. Absent preserves old canonical bytes;
  // present appends u8(1) || u64(value); required after any emergency disable.
  optional uint64 expected_plugin_control_version = 7;
}

// A correction of an original fact, never arbitrary lines/accounts/amounts.
// payment reads the original TradeSnapshot and original event independently.
message ReversalMaterial {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  uint64 expected_control_version = 3;
  string original_event_id = 4;
  string reason = 5;
  bytes evidence_sha256 = 6;
}

// Exactly the three existing reconciliation authorization directions. Receivers
// reject UNSPECIFIED (0) and unknown values. No arbitrary destination or amount.
enum DisputeRulingOutcome {
  DISPUTE_RULING_OUTCOME_UNSPECIFIED = 0;
  DISPUTE_RULING_OUTCOME_RELEASE_TO_ORIGINAL_RECIPIENT = 1;
  DISPUTE_RULING_OUTCOME_RETURN_TO_ORIGINAL_SELLER = 2;
  DISPUTE_RULING_OUTCOME_REFUND = 3;
}

// Immutable dossier. Either party's bytes may be empty only when investigation
// explains the absence; at least one is nonempty. Investigation is 1-1000 chars.
// Combined evidence <= 64 KiB. It is evidence to investigate, never a paid flag.
message DisputeEvidence {
  bytes seller_evidence = 1;
  bytes recipient_evidence = 2;
  string investigation = 3;
}

// Loaded from original order and confirmed ledger barrier, not caller ownership.
// No amount or destination override; trade must equal the stored original.
message DisputeRulingMaterial {
  string dispute_id = 1;
  aipay.common.v1.TradeSnapshot trade = 2;
  string escrow_reservation_id = 3;
  uint64 expected_control_version = 4;
  DisputeRulingOutcome outcome = 5;
  string reason = 6;
  // SHA-256(canonical DisputeEvidence bytes); evidence is returned separately.
  bytes evidence_sha256 = 7;
}

// Exactly one nonempty ID. A late payment on a cancelled order closes inside
// payment, without a terminal funds event, reconciliation or a ledger posting.
message SellerRefundSubject {
  oneof subject {
    string refund_id = 1;
    string late_payment_id = 2;
  }
}

// Each WebAuthn assertion binds the original order, recipient, seller, channel
// and full fiat amount/currency through trade. It also binds the subject and
// the exact evidence version and digest, including the ordered screenshot
// digests. Submitting a new version voids the request and all prior assertions.
message SellerRefundReviewMaterial {
  SellerRefundSubject subject = 1;
  aipay.common.v1.TradeSnapshot trade = 2;
  // Required for both subject types, including the original cancelled escrow.
  string escrow_reservation_id = 3;
  // Fields 4-7 must all be present for refunds and absent for late payments.
  optional string refund_reservation_id = 4;
  optional aipay.ledger.v1.RefundReservationBranch branch = 5;
  optional uint64 reservation_control_version = 6;
  optional string out_refund_no = 7;
  string upstream_refund_no = 8;
  google.protobuf.Timestamp refunded_at = 9;
  // Equal to the original trade quote in currency and minor units.
  aipay.common.v1.Money refunded_amount = 10;
  string evidence_id = 11;
  uint64 evidence_version = 12;
  bytes evidence_sha256 = 13;
  // Default 24 hours for refunds. Always zero for late payments.
  uint64 objection_window_seconds = 14;
}

message SellerRefundFailureMaterial {
  SellerRefundSubject subject = 1;
  aipay.common.v1.TradeSnapshot trade = 2;
  string escrow_reservation_id = 3;
  // Fields 4-7 must all be present for refunds and absent for late payments.
  optional string refund_reservation_id = 4;
  optional aipay.ledger.v1.RefundReservationBranch branch = 5;
  optional uint64 reservation_control_version = 6;
  optional string out_refund_no = 7;
  // Required, 1-1000 characters. Retained in the approval material.
  string reason = 8;
  // Both present exactly when the seller has submitted evidence.
  optional string evidence_id = 9;
  optional bytes evidence_sha256 = 10;
}

// A145. Facts payment loaded from its own order and from ledger when a
// platform user submitted the forced close of an unpaid order. The caller
// supplies only the order, the expected escrow control version and the
// reason. Each approval rechecks eligibility under the order lock and is
// refused if the trade, escrow reservation, control version,
// upstream_order_id or never_sent changed. status records the order state at
// submission; it may since have moved between AWAITING_PAYMENT and UNKNOWN.
message OrderForcedCloseMaterial {
  aipay.common.v1.TradeSnapshot trade = 1;
  string escrow_reservation_id = 2;
  // Positive ledger escrow control version at submission.
  uint64 expected_control_version = 3;
  // Required, 1-1000 characters.
  string reason = 4;
  // ORDER_STATUS_AWAITING_PAYMENT or ORDER_STATUS_UNKNOWN.
  OrderStatus status = 5;
  // Empty when payment never learned an upstream order ID.
  string upstream_order_id = 6;
  // True only when no create request can have reached the upstream and no
  // payment instruction was ever delivered.
  bool never_sent = 7;
  // Earliest time the close may take effect. Not after requested_at.
  google.protobuf.Timestamp eligible_at = 8;
}

// The executor creates these immutable signed materials. Exactly one operation
// must match kind. Header fields equal ApprovalRequest id/kind/requested_by/
// requested_at/expires_at. Canonical field-order encoding is specified in docs;
// request_bytes has a length-prefixed "aipay.payment.admin.v1" domain followed
// by canonical field-order material, NOT protobuf serialization. Unknown fields
// are rejected. Encode the selected operation field number (6-16) as u32
// before its expanded fields. Different encoding versions require a new domain.
message PaymentApprovalMaterial {
  string approval_request_id = 1;
  string kind = 2;
  string requested_by = 3;
  google.protobuf.Timestamp requested_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Two distinct platform natural persons must approve, neither equal to
  // requested_by. For seller_refund this is the submitting seller user. For
  // seller_refund_failure and forced_close the initiating platform user is
  // requested_by.
  oneof operation {
    ChannelAccountChange channel_account = 6;
    PaymentMethodChange payment_method = 7;
    RiskPolicyChange risk_policy = 8;
    PricingVersionChange pricing_version = 9;
    PluginVersionMaterial plugin_version = 10;
    PluginEnableChange plugin_enable = 11;
    ReversalMaterial reversal = 12;
    DisputeRulingMaterial dispute_ruling = 13;
    SellerRefundReviewMaterial seller_refund = 14;
    SellerRefundFailureMaterial seller_refund_failure = 15;
    OrderForcedCloseMaterial forced_close = 16;
  }
}

// Payment stores the original signed evidence without public keys. The stored
// request_bytes equal str("aipay.payment.admin.v1") || canonical(material).
// request_digest is SHA-256("AIPAY-APPROVAL-V1" || request_bytes). For a dispute
// ruling, this digest is DisputeResolution.ruling_sha256 and id is ruling_id.
message PaymentApproval {
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  PaymentApprovalMaterial material = 2;
  // Each approver counts once. Only reconciliation's verification reads return
  // complete assertions. Platform views and responses retain only assertion.credential_id.
  repeated aipay.approval.v1.Approval approvals = 3;
  // Absent until two approvals; equals second approval's verified_at.
  google.protobuf.Timestamp approved_at = 4;
}
