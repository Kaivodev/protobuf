syntax = "proto3";

package aipay.payment.v1;

import "aipay/payment/v1/admin_approval.proto";
import "aipay/payment/v1/refund_service.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/payment/v1;paymentv1";

// SignedEvent payloads on payment.account_notices. Producer payment, sole
// receiver backend. event_type is the message name and schema_version is 1.
// These account bot notifications are never payment or funds evidence.
// Funds services must not subscribe. Backend verifies the envelope and chain,
// deduplicates by event_id, and records deliveries per (event_id, chat_id).
// Backend routes MerchantPaymentReceived, MerchantFundsAvailable,
// PaymentAccessReviewed, MerchantRefundNotice and MerchantRiskExtensionNotice
// to the merchant bot, and every Seller* event to the upstream bot. Seller
// payloads exclude buyer and merchant identity, item names, evidence, dispute
// reasons, investigation text, approver identities and upstream order numbers.
// All fields are required unless specified. Timestamps are UTC with microsecond precision.

// MerchantPaymentReceived v1 on payment.account_notices. Payment writes it with
// OrderPaid v2 in one local transaction. Only backend receives this bot notice.
// It provides no payment or funds evidence.
message MerchantPaymentReceived {
  string account_id = 1;
  string business_id = 2;
  string application_id = 3;
  string order_id = 4;
  string trade_no = 5;
  string out_trade_no = 6;
  // Positive integer in the minor unit of fiat_currency from the original order.
  int64 fiat_amount = 7;
  // Registered fiat currency code, as in TradeQuoteSnapshot.
  string fiat_currency = 8;
  // Taken from OrderPaid.paid_verified_at.
  google.protobuf.Timestamp paid_at = 9;
}

// MerchantFundsAvailable v1 on payment.account_notices. Payment writes it at most
// once per order, in the inbox transaction processing the matching TradeReleased
// from ledger.trades. Only backend receives this bot notice. It provides no funds evidence.
message MerchantFundsAvailable {
  string account_id = 1;
  string business_id = 2;
  string application_id = 3;
  string order_id = 4;
  string trade_no = 5;
  string out_trade_no = 6;
  // Positive original recipient amount N in 10^-6 USDT.
  int64 recipient_usdt = 7;
  // Taken from occurred_at on the TradeReleased envelope.
  google.protobuf.Timestamp released_at = 8;
}

enum PaymentAccessReviewResult {
  PAYMENT_ACCESS_REVIEW_RESULT_UNSPECIFIED = 0;
  PAYMENT_ACCESS_REVIEW_RESULT_APPROVED = 1;
  PAYMENT_ACCESS_REVIEW_RESULT_REJECTED = 2;
}

// PaymentAccessReviewed v1 on payment.account_notices. Payment writes it with the
// state change approving or rejecting a payment-method application. Only backend
// receives this bot notice. It provides no funds evidence. Review reasons stay private.
message PaymentAccessReviewed {
  string account_id = 1;
  string business_id = 2;
  string payment_access_id = 3;
  uint64 revision_version = 4;
  string method = 5;
  // Required terminal result. Reject UNSPECIFIED and unknown values.
  PaymentAccessReviewResult result = 6;
  google.protobuf.Timestamp reviewed_at = 7;
}

enum SellerRefundNoticeKind {
  SELLER_REFUND_NOTICE_KIND_UNSPECIFIED = 0;
  SELLER_REFUND_NOTICE_KIND_PENDING = 1;
  SELLER_REFUND_NOTICE_KIND_OVERDUE = 2;
  SELLER_REFUND_NOTICE_KIND_CLOSED = 3;
}

// SellerRefundNotice v1 on payment.account_notices. Backend is the sole
// receiver. Notify the seller account on each entry into AWAITING_SELLER
// (including after rejection or objection), when overdue, or on closure.
// Bot notice only, never funds evidence.
message SellerRefundNotice {
  string seller_account_id = 1;
  SellerRefundSubject subject = 2;
  string order_id = 3;
  string trade_no = 4;
  string channel_account_id = 5;
  // Amount the seller must refund, in positive minor units of fiat_currency.
  int64 fiat_amount = 6;
  string fiat_currency = 7;
  google.protobuf.Timestamp seller_due_at = 8;
  SellerRefundNoticeKind kind = 9;
  google.protobuf.Timestamp occurred_at = 10;
  // Origin for a refund subject. Earlier v1 notices omit this field.
  RefundOrigin origin = 11;
}

enum MerchantRefundNoticeKind {
  MERCHANT_REFUND_NOTICE_KIND_UNSPECIFIED = 0;
  // Platform-, dispute- or amount-mismatch-initiated refund.
  MERCHANT_REFUND_NOTICE_KIND_CREATED = 1;
  MERCHANT_REFUND_NOTICE_KIND_CONFIRMING = 2;
  MERCHANT_REFUND_NOTICE_KIND_SUCCEEDED = 3;
  MERCHANT_REFUND_NOTICE_KIND_FAILED = 4;
}

// MerchantRefundNotice v1 on payment.account_notices. Backend is the sole
// receiver. Notify the original recipient account. SUCCEEDED follows ledger
// settlement. Bot notice only, never funds evidence. Excludes buyer details,
// screenshots, upstream refund numbers, reasons and approver identities.
message MerchantRefundNotice {
  string account_id = 1;
  string business_id = 2;
  string application_id = 3;
  string order_id = 4;
  string trade_no = 5;
  string out_trade_no = 6;
  string out_refund_no = 7;
  // Original positive fiat amount in minor units.
  int64 fiat_amount = 8;
  string fiat_currency = 9;
  // Present exactly when kind is CONFIRMING.
  google.protobuf.Timestamp objection_deadline = 10;
  MerchantRefundNoticeKind kind = 11;
  google.protobuf.Timestamp occurred_at = 12;
  // Earlier v1 notices omit this field.
  RefundOrigin origin = 13;
}

// Payment writes SellerOrderAssigned in the local transaction that first records
// a usable buyer payment instruction for the order. At most once per order.
message SellerOrderAssigned {
  string seller_account_id = 1;
  string channel_account_id = 2;
  string order_id = 3;
  string trade_no = 4;
  // Positive amount in minor units of fiat_currency.
  int64 fiat_amount = 5;
  string fiat_currency = 6;
  // Positive seller USDT held for this order, in units of 10^-6 USDT.
  int64 escrow_usdt = 7;
  // Present when the payment instruction has an expiry.
  google.protobuf.Timestamp instruction_expires_at = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

// Payment writes SellerInventoryLow when routing skips an otherwise eligible
// channel solely because the seller's known available USDT is below the order's
// escrow. At most once per seller per configured interval. Unknown inventory
// never produces this notice.
message SellerInventoryLow {
  string seller_account_id = 1;
  string channel_account_id = 2;
  // Nonnegative available inventory in units of 10^-6 USDT.
  int64 available_usdt = 3;
  // Required escrow in units of 10^-6 USDT. Greater than available_usdt.
  int64 required_usdt = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

enum SellerDisputeNoticeKind {
  SELLER_DISPUTE_NOTICE_KIND_UNSPECIFIED = 0;
  // Written with the dispute registration.
  SELLER_DISPUTE_NOTICE_KIND_OPENED = 1;
  // Written when the case becomes RESOLVED (final execution confirmed).
  SELLER_DISPUTE_NOTICE_KIND_RESOLVED = 2;
}

// Payment writes at most one notice per (dispute_id, kind).
message SellerDisputeNotice {
  string seller_account_id = 1;
  string dispute_id = 2;
  string order_id = 3;
  string trade_no = 4;
  string channel_account_id = 5;
  // Positive amount in minor units of fiat_currency.
  int64 fiat_amount = 6;
  string fiat_currency = 7;
  // Required. Reject UNSPECIFIED and unknown values.
  SellerDisputeNoticeKind kind = 8;
  // Present exactly when kind is RESOLVED.
  optional DisputeRulingOutcome outcome = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

enum RiskExtensionNoticeKind {
  RISK_EXTENSION_NOTICE_KIND_UNSPECIFIED = 0;
  // Seller only, for the seller's own request.
  RISK_EXTENSION_NOTICE_KIND_SUBMITTED = 1;
  RISK_EXTENSION_NOTICE_KIND_APPLIED = 2;
  // Seller only.
  RISK_EXTENSION_NOTICE_KIND_REJECTED = 3;
  // Seller only.
  RISK_EXTENSION_NOTICE_KIND_EXPIRED = 4;
}

// SellerRiskExtensionNotice v1 on payment.account_notices. Backend delivers
// it through the upstream bot. Excludes approver identities and reasons.
message SellerRiskExtensionNotice {
  string seller_account_id = 1;
  string order_id = 2;
  string trade_no = 3;
  string channel_account_id = 4;
  string extension_id = 5;
  RiskExtensionNoticeKind kind = 6;
  google.protobuf.Timestamp previous_risk_release_at = 7;
  // Present exactly for APPLIED.
  google.protobuf.Timestamp risk_release_at = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

// MerchantRiskExtensionNotice v1 on payment.account_notices. Backend delivers
// it only for APPLIED, to the original recipient account. Carries the new
// expected availability time and no reason.
message MerchantRiskExtensionNotice {
  string account_id = 1;
  string business_id = 2;
  string application_id = 3;
  string order_id = 4;
  string trade_no = 5;
  string out_trade_no = 6;
  google.protobuf.Timestamp risk_release_at = 7;
  google.protobuf.Timestamp occurred_at = 8;
}
