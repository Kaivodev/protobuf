syntax = "proto3";

package aipay.reconciliation.v1;

import "aipay/approval/v1/approval.proto";
import "aipay/reconciliation/v1/coverage_attestation.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/reconciliation/v1;reconciliationv1";

// All required IDs/versions/digests/times must be present; UUIDv7 IDs,
// SHA-256 exactly 32 bytes, UTC microseconds. Reject unknown fields/enums,
// incomplete material, unverified authority and stale versions. Never log
// secrets, raw credentials, assertions or fixture evidence. See contracts.md.

message PluginFixture {
  // Sorted unique normalized relative path under fixtures/, no links/traversal.
  string path = 1;
  bytes content = 2;
}

// Independently admitted verification packages must declare query_payment
// and may also declare query_refund. Not payment or statement, no payment secret references.
// CI pins source and toolchain and rejects uncommitted code. Gateway mode
// requires a canonical ABI v3 manifest with Rust build fields and a component
// up to 4 MiB. The verification gateway verifies it with ReplayPackage.
// Embedded mode uses ABI v2 Go wasip1 reactors up to 12 MiB.
message PluginVersionMaterial {
  string plugin_version_id = 1;
  bytes manifest_json = 2;
  // The package is bound by digest; reconciliation stores the uploaded
  // plugin.wasm and fixtures itself, keeping approval responses small.
  // SHA-256 over the canonical encoding of the sorted fixtures (contracts.md).
  // Replay covers each declared operation's success/reject/timeout/bad signature/amount
  // mismatch in the verification domain.
  bytes fixtures_sha256 = 3;
  reserved 4;
  // SHA-256(normalized manifest_json || plugin_wasm), matching CI artifact.
  bytes package_sha256 = 5;
  // Digest of the successful replay report from the verification gateway or embedded host.
  bytes regression_report_sha256 = 6;
}

// The immutable reference identifies separately issued read-only credentials
// for this payment channel in the verification domain.
// New accounts start disabled; configuration changes also disable until a new
// two-person plugin-enable approval validates the new control version.
message VerificationAccountConfiguration {
  string verification_account_id = 1;
  // Independently verified payment channel selector, immutable after creation.
  string channel_account_id = 2;
  string name = 3;
  bytes config_json = 4;
  string credentials_ref = 5;
  // Gateway mode requires the digest reconciliation registered for this ref.
  // Embedded mode rejects this field. Canonical encoding appends
  // u8(1) || B(value) after field 5 when present. Absence adds no bytes.
  optional bytes credentials_sha256 = 6;
}

message VerificationAccountChange {
  VerificationAccountConfiguration configuration = 1;
  // 0 only for new ID, otherwise positive current account control version.
  uint64 expected_control_version = 2;
}

// Separate approval from package publication. Reconciliation loads hashes and
// publication proof itself. Rollback/resume are new two-person enable approvals.
message PluginEnableChange {
  string verification_account_id = 1;
  uint64 expected_control_version = 2;
  string plugin_version_id = 3;
  bytes package_sha256 = 4;
  string publication_approval_request_id = 5;
  bytes publication_request_digest = 6;
  // v0.9.0: approved plugin-wide fence. Absent preserves old canonical bytes;
  // present appends u8(1) || u64(value); required after any emergency disable.
  optional uint64 expected_plugin_control_version = 7;
}

// v0.23.0 (A130): minimum spacing between the two upstream observations for
// cancellation verification. expected_current_version is the current approved
// version, or 0 when none exists. version = expected_current_version + 1.
// window_seconds is in whole seconds, 600..3600 in production and 1..3600 in
// development/test. Without an approved version, reconciliation uses
// AIPAY_RECONCILIATION_LATE_PAYMENT_WINDOW. Reconciliation rejects out-of-range
// values at submission and second approval, which also rechecks expected_current_version.
// reason is 1-1000 characters. At most one late_payment_window request may be
// pending globally. requested_by cannot approve. A new version applies only to
// cancellation reviews whose first observation occurs after approval.
message LatePaymentWindowMaterial {
  uint64 version = 1;
  uint64 expected_current_version = 2;
  uint32 window_seconds = 3;
  string reason = 4;
}

// Domain-owned material; never use aipay.payment.v1 approval material. Headers
// equal ApprovalRequest. request_bytes = str("aipay.reconciliation.admin.v1")
// || canonical(material), NOT protobuf serialization. Canonical field-order
// encoding follows docs contracts.md: headers 1-5, u32 operation tag (6-10), recursive
// operation content, JSON normalized, fixtures sorted; unknown fields rejected.
// request_digest = SHA-256("AIPAY-APPROVAL-V1" || request_bytes), with a raw
// 17-byte ASCII prefix. The WebAuthn challenge equals request_digest.
// For coverage_attestation, expand field 9 recursively in field-number order
// without message length prefixes. Write repeated values as a u32 count then
// elements in the specified order. Prefix strings/bytes with a u32 byte length.
// Encode int64/uint64 in 8 bytes, uint32/enums in 4 bytes, all big-endian.
// Timestamps are i64 Unix nanoseconds at whole microseconds. Optional scalars
// start with u8(0) for absence or u8(1) followed by the value for presence.
message ReconciliationApprovalMaterial {
  string approval_request_id = 1;
  string kind = 2;
  string requested_by = 3;
  google.protobuf.Timestamp requested_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Exactly one, with kind equal to the branch name. required_approvals is 2,
  // from two different natural persons in reconciliation's own approver registry.
  // Only for coverage_attestation may requested_by be one of the two approvers.
  // Every approval request expires exactly 24h after requested_at. A
  // coverage_attestation cannot be approved at or after its material's expires_at.
  oneof operation {
    VerificationAccountChange verification_account = 6;
    PluginVersionMaterial plugin_version = 7;
    PluginEnableChange plugin_enable = 8;
    CoverageAttestationMaterial coverage_attestation = 9;
    LatePaymentWindowMaterial late_payment_window = 10;
  }
}

message ReconciliationApproval {
  aipay.approval.v1.ApprovalRequest approval_request = 1;
  ReconciliationApprovalMaterial material = 2;
  // Records in verified_at/approver_id order, without public keys.
  // Platform responses retain only credential_id in each assertion.
  repeated aipay.approval.v1.Approval approvals = 3;
  // Absent until two valid approvals; equals second verified_at.
  google.protobuf.Timestamp approved_at = 4;
}
