syntax = "proto3";

package aipay.reconciliation.v1;

import "aipay/approval/v1/approval.proto";
import "aipay/authz/v1/policy.proto";
import "aipay/common/v1/query.proto";
import "aipay/reconciliation/v1/admin_approval.proto";
import "aipay/reconciliation/v1/coverage_admin.proto";
import "aipay/reconciliation/v1/late_payment_window_admin.proto";
import "aipay/reconciliation/v1/plugin_control.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/reconciliation/v1;reconciliationv1";

message VerificationAccount {
  VerificationAccountConfiguration configuration = 1;
  uint64 control_version = 2;
  optional bool enabled = 3;
  // Empty until a plugin is independently approved and bound.
  string plugin_version_id = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Safe list metadata, no raw credentials or secret references from payment.
message PluginVersion {
  string plugin_version_id = 1;
  string code = 2;
  string semver = 3;
  bytes package_sha256 = 4;
  bytes regression_report_sha256 = 5;
  string publication_approval_request_id = 6;
  aipay.approval.v1.ApprovalStatus status = 7;
  // v0.9.0 plugin-wide fence, starts at 1; separate from publication status.
  uint64 control_version = 8;
  optional bool emergency_disabled = 9;
  google.protobuf.Timestamp disabled_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

// ReplayPackage on the verification gateway must reproduce the uploaded
// package_sha256 before approval.
message UploadPluginRequest {
  string idempotency_key = 1;
  // Supply a canonical manifest with abi_version=3 and Rust build fields
  // (rust_version, target, wasm_tools_version, source_commit, source_tree_sha256).
  // Reject uncommitted builds.
  bytes manifest_json = 2;
  // ABI v3 Rust component up to 4 MiB. The whole request is at most 16 MiB.
  bytes plugin_wasm = 3;
  // Total <=3 MiB, contains no real credentials or personal information.
  repeated PluginFixture fixtures = 4;
  bytes package_sha256 = 5;
}

message UploadPluginResponse {
  ReconciliationApproval approval = 1;
}

message ApprovePluginRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApprovePluginResponse {
  ReconciliationApproval approval = 1;
}

message StoreVerificationCredentialsRequest {
  string idempotency_key = 1;
  string channel_account_id = 2;
  // Sensitive ingress ONLY, strict JSON reference-name -> secret-value map,
  // <=64 KiB, no duplicate keys. Backend memory-only pass-through over mTLS;
  // reconciliation computes the digest and checks the independent read-only
  // credential attestation before storage. The verification instance seals the
  // credentials. Reconciliation stores only the ref, digest and credential names.
  // No logs/cache/disk, no secrets in config_json or plugin memory.
  bytes credentials_json = 3;
}

message StoreVerificationCredentialsResponse {
  // The verification instance generates this immutable ref with the
  // reconciliation:verification: prefix.
  string credentials_ref = 1;
  // 32-byte SHA-256 of canonical credential JSON. Reconciliation verifies the
  // instance's digest against the hash of the inbound credentials before returning it.
  bytes credentials_sha256 = 2;
}

message SubmitVerificationAccountRequest {
  string idempotency_key = 1;
  VerificationAccountChange change = 2;
}

message SubmitVerificationAccountResponse {
  ReconciliationApproval approval = 1;
}

message ApproveVerificationAccountRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApproveVerificationAccountResponse {
  ReconciliationApproval approval = 1;
}

message RequestPluginEnableRequest {
  string idempotency_key = 1;
  string verification_account_id = 2;
  uint64 expected_control_version = 3;
  string plugin_version_id = 4;
  // v0.9.0: current plugin fence; required after any emergency disable.
  optional uint64 expected_plugin_control_version = 5;
}

message RequestPluginEnableResponse {
  ReconciliationApproval approval = 1;
}

message ApprovePluginEnableRequest {
  string idempotency_key = 1;
  string approval_request_id = 2;
  aipay.approval.v1.WebAuthnAssertion assertion = 3;
}

message ApprovePluginEnableResponse {
  ReconciliationApproval approval = 1;
}

message DisableVerificationAccountRequest {
  string idempotency_key = 1;
  string verification_account_id = 2;
  uint64 expected_control_version = 3;
  // 1-1000 characters, no secrets.
  string reason = 4;
}

message DisableVerificationAccountResponse {
  VerificationAccount account = 1;
}

message ListVerificationAccountsRequest {
  // Optional exact filter; absence cannot expand authorized data scope.
  string channel_account_id = 1;
  uint32 limit = 2;
  string page_token = 3;
}

message ListVerificationAccountsResponse {
  repeated VerificationAccount accounts = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp as_of = 3;
}

message GetVerificationAccountRequest {
  string verification_account_id = 1;
}

message GetVerificationAccountResponse {
  VerificationAccount account = 1;
  google.protobuf.Timestamp as_of = 2;
}

message ListPluginsRequest {
  uint32 limit = 1;
  string page_token = 2;
}

message ListPluginsResponse {
  repeated PluginVersion plugins = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp as_of = 3;
}

message GetPluginRequest {
  string plugin_version_id = 1;
}

message GetPluginResponse {
  PluginVersion plugin = 1;
  ReconciliationApproval publication = 2;
  google.protobuf.Timestamp as_of = 3;
}

message GetApprovalRequest {
  string approval_request_id = 1;
}

message GetApprovalResponse {
  ReconciliationApproval approval = 1;
  google.protobuf.Timestamp as_of = 2;
}

message ListApprovalsRequest {
  // Optional exact kind; only unexpired PENDING requests are listed.
  string kind = 1;
  // Required 1-100; reject values outside the range, never clamp.
  uint32 limit = 2 [(aipay.common.v1.max_items) = 100];
  // Opaque, snapshot/filter/method/subject/scope-bound cursor; empty first page.
  string page_token = 3;
}

message ListApprovalsResponse {
  repeated aipay.approval.v1.ApprovalRequest approvals = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp as_of = 3;
}

// backend INTERNAL management listener only, verified USER/platform proof;
// Requires bearer web_entry=platform_admin with WebAuthn; reject Telegram,
// application and workload proofs. Reconciliation enforces scope, target and
// independent WebAuthn
// approval with its own offline registry (ES256, origin/RP, UP/UV, counters/A80).
// IAM login registry and payment approval/credentials cannot substitute. No
// management method releases funds or makes payment evidence independent.
// All writes idempotent per method/verified user/key, changed content AlreadyExists;
// authorized identical retries return original result before fresh CAS/expiry.
// Approvals require two different natural persons and expire 24h after the request.
// Only coverage_attestation allows the submitter as one of the two approvers.
// It also cannot be approved at or after the material's expires_at.
// On second approval, plugin and verification-account operations recheck the
// kind, CAS, channel, credentials and package authority, then atomically record
// the approvals, result and configuration. Unknown or failed states deny the
// operation. Publication and enabling are separate approvals;
// configuration changes disable and advance control_version. Emergency disable
// is one designated person, stops new verification/authorization immediately;
// in-flight issuance rechecks enabled/control_version. Resuming/rollback requires
// a new two-person enable approval against the post-disable control_version.
// Channel selectors are checked with payment ChannelVerificationService at
// credential admission, account submission and final approval. No payment
// secret is returned by that narrow read. Errors deny, never trust backend IDs.
// Verification plugins require query_payment and may also declare query_refund.
// Credentials are separately issued, read-only and encrypted within this domain.
// Responses exclude secrets.
// Lists use a 1-500 limit and opaque filter/scope-bound cursors. GetApproval
// returns original material and request bytes in any state within the 16 MiB
// message limit. Each approval assertion in GetApproval, GetPlugin publication
// records and Approve* responses contains only credential_id.
// ListApprovals returns headers only, ordered by descending requested_at/ID
// at a consistent as_of snapshot. Its opaque cursor binds method, user, scope,
// filter and limit (1-100). Recheck access on every page.
// EmergencyDisablePlugin: one platform approver with MFA_RECENT plus independent
// domain WebAuthn. Atomically disable plugin and all bound verification accounts;
// stop ALL verification and reject related authorizations, including in-flight
// results at issuance. Recovery requires NEW two-person enable approvals. No
// payment material/credentials or single-person resume. See contracts.md v0.9.0.
// MFA_RECENT writes carry command_sha256. Coverage approval and revocation also
// require a raw WebAuthn assertion verified against reconciliation's own admin
// approver registry. ListApprovals and GetApproval also return coverage_attestation.
// Before each release, cancellation or refund issuance, re-verify the latest
// approved material, both signatures, registry membership, expiry and revocation.
service ReconciliationAdminService {
  rpc UploadPlugin(UploadPluginRequest) returns (UploadPluginResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.plugin.upload"
      }
    };
  }
  rpc ApprovePlugin(ApprovePluginRequest) returns (ApprovePluginResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.plugin.approve"
      }
    };
  }
  rpc StoreVerificationCredentials(StoreVerificationCredentialsRequest) returns (StoreVerificationCredentialsResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.account.manage"
      }
    };
  }
  rpc SubmitVerificationAccount(SubmitVerificationAccountRequest) returns (SubmitVerificationAccountResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.account.manage"
      }
    };
  }
  rpc ApproveVerificationAccount(ApproveVerificationAccountRequest) returns (ApproveVerificationAccountResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.account.approve"
      }
    };
  }
  rpc RequestPluginEnable(RequestPluginEnableRequest) returns (RequestPluginEnableResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.plugin.enable"
      }
    };
  }
  rpc ApprovePluginEnable(ApprovePluginEnableRequest) returns (ApprovePluginEnableResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.plugin.approve"
      }
    };
  }
  rpc DisableVerificationAccount(DisableVerificationAccountRequest) returns (DisableVerificationAccountResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.account.disable"
      }
    };
  }
  rpc ListVerificationAccounts(ListVerificationAccountsRequest) returns (ListVerificationAccountsResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.account.read"
      }
    };
  }
  rpc GetVerificationAccount(GetVerificationAccountRequest) returns (GetVerificationAccountResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.account.read"
      }
    };
  }
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.plugin.read"
      }
    };
  }
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.plugin.read"
      }
    };
  }
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.approval.read"
      }
    };
  }
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.approval.read"
      }
    };
  }
  rpc EmergencyDisablePlugin(EmergencyDisablePluginRequest) returns (EmergencyDisablePluginResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_MFA_RECENT
        permissions: "reconciliation.plugin.disable"
        recent_auth_max_age_seconds: 600
      }
    };
  }
  rpc SubmitCoverageAttestation(SubmitCoverageAttestationRequest) returns (SubmitCoverageAttestationResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_MFA_RECENT
        permissions: "reconciliation.coverage.submit"
        recent_auth_max_age_seconds: 600
      }
    };
  }
  rpc ApproveCoverageAttestation(ApproveCoverageAttestationRequest) returns (ApproveCoverageAttestationResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_MFA_RECENT
        permissions: "reconciliation.coverage.approve"
        recent_auth_max_age_seconds: 600
      }
    };
  }
  rpc RevokeCoverageAttestation(RevokeCoverageAttestationRequest) returns (RevokeCoverageAttestationResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_MFA_RECENT
        permissions: "reconciliation.coverage.revoke"
        recent_auth_max_age_seconds: 600
      }
    };
  }
  rpc GetCoverageAttestation(GetCoverageAttestationRequest) returns (GetCoverageAttestationResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.coverage.read"
      }
    };
  }
  rpc ListCoverageAttestations(ListCoverageAttestationsRequest) returns (ListCoverageAttestationsResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.coverage.read"
      }
    };
  }
  rpc GetCoverageStatus(GetCoverageStatusRequest) returns (GetCoverageStatusResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.coverage.read"
      }
    };
  }
  rpc ListCoverageAddresses(ListCoverageAddressesRequest) returns (ListCoverageAddressesResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.coverage.read"
      }
    };
  }
  rpc SubmitLatePaymentWindow(SubmitLatePaymentWindowRequest) returns (SubmitLatePaymentWindowResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_MFA_RECENT
        permissions: "reconciliation.late_window.submit"
        recent_auth_max_age_seconds: 600
      }
    };
  }
  rpc ApproveLatePaymentWindow(ApproveLatePaymentWindowRequest) returns (ApproveLatePaymentWindowResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_MFA_RECENT
        permissions: "reconciliation.late_window.approve"
        recent_auth_max_age_seconds: 600
      }
    };
  }
  rpc GetLatePaymentWindow(GetLatePaymentWindowRequest) returns (GetLatePaymentWindowResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.late_window.read"
      }
    };
  }
  rpc ListLatePaymentWindows(ListLatePaymentWindowsRequest) returns (ListLatePaymentWindowsResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_REQUIRED
        permissions: "reconciliation.late_window.read"
      }
    };
  }
}
