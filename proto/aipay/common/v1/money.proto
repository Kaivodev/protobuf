syntax = "proto3";

package aipay.common.v1;

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/common/v1;commonv1";

// Conventions shared by every Kaivo contract:
//   - Internal IDs (orders, events, journal transactions, payouts, approval
//     requests) are UUIDv7 strings in canonical lowercase form, generated by
//     the owning service.
//   - Times are UTC google.protobuf.Timestamp values. Business facts carry both
//     occurred_at (when it happened) and recorded_at (when it was written); a
//     late record never rewrites occurred_at. Timestamps that feed a signature
//     or hash have microsecond precision, matching PostgreSQL TIMESTAMPTZ.
//   - Amounts, fee rates and exchange rates are never parsed or computed with
//     floating point. Fee rates are int32 fields named *_fee_rate_ppm (parts
//     per million, 0 to 1,000,000 inclusive).

// An amount in the minor unit of `currency`. Journal lines use a direction and
// a positive amount; balances may be negative and use the same signed field.
message Money {
  // A code registered in Currency, e.g. CNY or USDT. Unknown codes are rejected.
  string currency = 1;
  // Integer count of minor units; see CurrencyInfo.minor_unit_exponent.
  int64 units = 2;
}

// Units of `quote_currency` per one unit of `base_currency`, e.g. base USDT,
// quote CNY, value "7.20".
message ExchangeRate {
  string base_currency = 1;
  string quote_currency = 2;
  // Plain decimal string: at most 12 integer and 10 fractional digits, no sign,
  // exponent or grouping. Parse with exact rational arithmetic.
  string value = 3;
  // Exchange rate version that produced this value.
  string version_id = 4;
}
