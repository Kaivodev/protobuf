syntax = "proto3";

package aipay.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/iam/v1;iamv1";

// Trusted lifecycle facts only, not credentials. Positive versions, required
// enabled presence, immutable decimal pid, UUIDv7 IDs. Created starts ownership
// version 1. Status updates cannot change owner/business/pid, clear transfer
// barriers or refresh an unlimited lease. Historical orders retain their owner.
message ApplicationOwnership {
  string application_id = 1;
  string business_id = 2;
  string account_id = 3;
  string pid = 4;
  uint64 ownership_version = 5;
  uint64 application_version = 6;
  optional bool enabled = 7;
}

// iam.applications, producer iam, sole receiver payment, schema_version=1,
// event_type=ApplicationCreated. Same-transaction application/outbox; transport
// is existing SignedEvent/EventStreamService with IAM signature and stream ACL.
// Receiver deduplicates event ID and pins application ID/pid/ownership. This
// supplies initial payment_ownership facts; request parameters are not a source.
message ApplicationCreated {
  ApplicationOwnership ownership = 1;
  google.protobuf.Timestamp created_at = 2;
}

// iam.applications, producer iam, sole receiver payment, schema_version=1,
// event_type=ApplicationStatusChanged. Transactional enabled-state fact. Reject
// stale application_version, same-version conflicting content and illegal owner
// changes. Resource versions may skip on credential writes; stream sequences
// must remain contiguous. Across ownership versions wait for authorized
// business-transfer facts
// and barriers, never apply arrival order across streams. Consumers need fresh
// stream health and a dispatch gate, not just an old enabled=true snapshot.
// All times UTC microseconds. No secret keys, roles or session assertions.
message ApplicationStatusChanged {
  ApplicationOwnership ownership = 1;
  google.protobuf.Timestamp changed_at = 2;
}
