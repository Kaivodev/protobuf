syntax = "proto3";

package aipay.iam.v1;

import "aipay/authz/v1/policy.proto";
import "aipay/common/v1/context.proto";
import "aipay/iam/v1/identity.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aipay-dev/protobuf/gen/go/aipay/iam/v1;iamv1";

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_ASSIGNED = 1;
  DATA_SCOPE_SELF = 2;
  // Cross-account access requires an explicit platform-scoped grant.
  DATA_SCOPE_PLATFORM_ALL = 3;
}

message PermissionGrant {
  // Stable catalog key, e.g. payment.order.create. No wildcard implication.
  string permission = 1;
  DataScope data_scope = 2;
}

message Role {
  string id = 1;
  string name = 2;
  aipay.common.v1.ScopeType scope_type = 3;
  repeated PermissionGrant grants = 4;
}

message RoleBinding {
  string principal_id = 1;
  PrincipalType principal_type = 2;
  string role_id = 3;
  aipay.common.v1.Scope scope = 4;
}

enum DenialReason {
  DENIAL_REASON_UNSPECIFIED = 0;
  DENIAL_REASON_NO_GRANT = 1;
  DENIAL_REASON_INACTIVE_PRINCIPAL = 2;
  DENIAL_REASON_SCOPE_MISMATCH = 3;
  DENIAL_REASON_RESOURCE_OWNERSHIP = 4;
}

// The authorization decision returned by Authorize. The default is deny.
// Transport errors, empty responses and invalid proof must also be treated as
// denial by consumers.
message AuthorizationDecision {
  bool allowed = 1;
  string decision_id = 2;
  string policy_revision = 3;
  DenialReason denial_reason = 4;
  // Required for an allowed decision. Consumers must apply the constraint to
  // canonical resource attributes or to every row of a list query.
  AccessConstraint constraint = 5;
  string granted_role_id = 6;
}

message AccessConstraint {
  DataScope data_scope = 1;
  // The resource scope the decision is limited to, with the trusted account_id
  // for any funds or account resource. Business and application scopes never
  // imply account-wide funds permissions.
  aipay.common.v1.Scope scope = 2;
  // Required when data_scope is SELF. Resolve actual ownership in the resource
  // service; do not accept owner IDs supplied by an external caller.
  Principal owner = 3;
}

// Gateway hot path: authenticate the credential and authorize the bound
// operation in one call, so each public request needs a single IAM round trip.
message AuthorizeRequest {
  aipay.common.v1.RequestContext context = 1;
  oneof credential {
    BearerCredential bearer = 2;
    EPayV1SignatureCredential epay_v1_signature = 3;
    EPayV1KeyCredential epay_v1_key = 4;
    EPayV2SignatureCredential epay_v2_signature = 5;
    WorkloadIdentityCredential workload_identity = 6;
  }
  string audience = 7;
  // Route facts including the required permission. IAM validates the
  // protocol/operation pairing before evaluating any grant.
  RequestBinding request_binding = 8;
  // Explicit active role context selected by the website: platform, account,
  // business or application, with the full ID chain of that scope. Never
  // inferred from the credential alone; empty or equal to the bound scope for
  // merchant applications. IAM verifies ownership, membership and the chain,
  // and rejects any mismatch.
  aipay.common.v1.Scope acting_scope = 9;
  aipay.common.v1.ResourceRef resource = 10;
}

message AuthorizeResponse {
  Principal principal = 1;
  // Short-lived proof bound to this request for downstream resource services.
  string identity_assertion = 2;
  google.protobuf.Timestamp expires_at = 3;
  string credential_id = 4;
  bytes request_fingerprint = 5;
  // Missing or denied means deny, and an allowed decision is usable only
  // together with its constraint.
  AuthorizationDecision decision = 6;
  // The trusted acting scope IAM resolved, identical to the assertion's
  // acting_scope; carries the funds account_id for account, business and
  // application scopes.
  aipay.common.v1.Scope acting_scope = 7;
}

// Internal only. An allowed decision is not a transferable money-operation
// capability. Resource services independently enforce ownership and state.
// Authorize is the only authentication and authorization entry point: the
// gateway calls it once per request, and interfaces that only confirm identity
// use a permission that stands for "the caller themself" (decision A78).
// Invalid, disabled, expired or revoked credentials fail with a gRPC error; an
// authenticated principal without a grant receives a denied decision.
service AuthorizationService {
  // IAM issues assertions, so the gateway call carries none.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse) {
    option (aipay.authz.v1.policy) = {
      rules: {
        callers: "backend"
        assertion: ASSERTION_REQUIREMENT_NOT_REQUIRED
      }
    };
  }
}
