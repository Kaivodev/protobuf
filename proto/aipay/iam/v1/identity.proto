syntax = "proto3";

package aipay.iam.v1;

import "aipay/common/v1/context.proto";

option go_package = "github.com/Kaivodev/protobuf/gen/go/aipay/iam/v1;iamv1";

enum PrincipalType {
  PRINCIPAL_TYPE_UNSPECIFIED = 0;
  PRINCIPAL_TYPE_USER = 1;
  PRINCIPAL_TYPE_MERCHANT_APPLICATION = 2;
  PRINCIPAL_TYPE_SERVICE = 3;
}

message Principal {
  string id = 1;
  PrincipalType type = 2;
  // Merchant applications are bound to their application scope, carrying the
  // trusted business and account of the application.
  aipay.common.v1.Scope bound_scope = 3;
}

message BearerCredential {
  // Sensitive. Never include this value in logs or audit payloads.
  string token = 1;
}

// Receivers reject UNSPECIFIED (0), unknown values and channel identities.
enum TelegramChatType {
  TELEGRAM_CHAT_TYPE_UNSPECIFIED = 0;
  TELEGRAM_CHAT_TYPE_PRIVATE = 1;
  TELEGRAM_CHAT_TYPE_GROUP = 2;
  TELEGRAM_CHAT_TYPE_SUPERGROUP = 3;
}

// Update facts supplied only by backend's configured bot module after webhook
// secret validation. Reject sender_chat, anonymous administrators and channels;
// never infer the sender from forwarded content. These facts and their digest
// are not an independent Telegram signature or caller-selected user authority.
// Deduplicate update_id in the configured bot namespace, bind it to these facts
// and reject changed content; out-of-order updates cannot overwrite new state.
message TelegramCredential {
  // Positive Telegram user ID, resolved through IAM's unique binding.
  int64 telegram_user_id = 1;
  // Nonzero signed ID; group IDs can be negative.
  int64 chat_id = 2;
  TelegramChatType chat_type = 3;
  // Required presence; nonnegative, including valid update ID 0.
  optional int64 update_id = 4;
  // Exactly 32 bytes: SHA-256 of the original webhook HTTP body bytes.
  bytes update_body_sha256 = 5;
}

// IAM validates the credential itself. Only a human user's session or unique
// Telegram binding is accepted, never an API application/workload. Telegram
// security settings require PRIVATE; IDs in the request confer no authority.
message UserAuthentication {
  oneof credential {
    BearerCredential bearer = 1;
    TelegramCredential telegram = 2;
  }
}

// Preserve decoded scalar bytes and include extension parameters. Duplicate
// names are rejected by IAM; canonicalization is specific to the EPay version.
message EPayParameter {
  string name = 1;
  string value = 2;
}

message EPayV1SignatureCredential {
  repeated EPayParameter parameters = 1;
}

message EPayV1KeyCredential {
  string pid = 1;
  // Sensitive. Never log or echo the shared key.
  string key = 2;
}

message EPayV2SignatureCredential {
  repeated EPayParameter parameters = 1;
}

// Explicit workload authentication uses the verified transport identity and IAM
// service registry. It never accepts a caller-selected service ID in the body.
message WorkloadIdentityCredential {}

// The authenticated gateway supplies these route facts over its private service
// channel. IAM validates the protocol/operation pairing before issuing proof.
message RequestBinding {
  string http_method = 1;
  string http_path = 2;
  string permission = 3;
}
